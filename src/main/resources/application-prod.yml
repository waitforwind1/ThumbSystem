spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${MYSQL_PASSWORD}
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:thumbs}

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0


  session:
    store-type: redis

  rabbitmq:
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: /
    publisher-returns: true    # 开启callback 回调机制
    publisher-confirm-type: correlated   # 开启confirm回调机制
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          max-attempts: 3
          initial-interval: 1000ms
          max-interval: 10000ms
          enabled: true
        default-requeue-rejected: false
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://elasticsearch:9200}
tencent:
  cos:
    region: ap-shanghai
    appId: 1352223903
    secretId: ${TENCENT_COS_SECRET_ID}
    secretKey: ${TENCENT_COS_SECRET_KEY}
    base-url: https://zerocode-1352223903.cos.ap-shanghai.myqcloud.com
    bucket: zerocode-1352223903

springdoc:
  swagger-ui:
    enabled: false


knife4j:
  setting:
    language: zh_cn
  basic:
    enable: false

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5172}
  upload:
    dir: ${UPLOAD_DIR:/app/uploads}
    url-prefix: /upload
