services:
  app:
    build: .
    container_name: thumbs-app
    restart: unless-stopped
    depends_on:
      - redis
      - rabbitmq
      - mysql
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      TENCENT_COS_SECRET_ID: ${TENCENT_COS_SECRET_ID}
      TENCENT_COS_SECRET_KEY: ${TENCENT_COS_SECRET_KEY}
      TZ: Asia/Shanghai

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    container_name: thumbs-mysql
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: thumbs
      TZ: Asia/Shanghai
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7
    container_name: thumbs-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - thumbs-redis-data:/data
    environment:
      TZ: Asia/Shanghai
    command:
      - redis-server
      - --requirepass ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --appendfsync
      - always
      - --maxmemory-policy
      - noeviction
      # Refuse new writes if the only replica is unavailable or lagging.
      - --min-replicas-to-write
      - "1"
      - --min-replicas-max-lag
      - "1"

  redis-replica:
    image: redis:7
    container_name: thumbs-redis-replica
    restart: unless-stopped
    depends_on:
      - redis
    volumes:
      - thumbs-redis-replica-data:/data
    environment:
      TZ: Asia/Shanghai
    command:
      - redis-server
      - --replicaof
      - redis
      - "6379"
      - --masterauth
      - ${REDIS_PASSWORD}
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --appendfsync
      - always
      - --maxmemory-policy
      - noeviction


  rabbitmq:
    image: rabbitmq:4-management
    container_name: thumbs-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_USER: guest
      TZ: Asia/Shanghai
    volumes:
      - thumbs-rabbitmq-data:/var/lib/rabbitmq

  elasticsearch:
    image: elasticsearch:9.4.2
    restart: unless-stopped
    container_name: thumbs-elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - thumbs-es-data:/usr/share/elasticsearch/data
volumes:
  thumbs-rabbitmq-data:
  thumbs-redis-data:
  thumbs-redis-replica-data:
  thumbs-es-data:


